packages:
  - "apps/*"
  - "packages/*"
overrides:
  # expo-router pulls react-native-reanimated in transitively (via its
  # drawer-navigation support, react-native-drawer-layout) at whatever the
  # newest matching semver happens to be. Pinned here to the exact version
  # `expo install` resolved as compatible with this project's Expo SDK, so
  # it can't drift to a second, mismatched copy alongside the apps' own
  # direct dependency — that duplication was the real cause of a runtime
  # crash ("Cannot read property 'getUseOfValueInStyleWarning' of
  # undefined") even though neither app actually renders a Drawer.
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.4'
  - '@next/eslint-plugin-next@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - eslint-config-next@16.3.4
  - next@16.3.4
  - '@expo/cli@57.0.21'
  - '@expo/fingerprint@0.20.12'
  - '@expo/metro-runtime@57.0.15'
  - '@expo/router-server@57.0.9'
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-font@57.0.3
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo@57.0.19
  - '@expo/ui@57.0.15'
  - expo-linking@57.0.9
  - expo-router@57.0.18
